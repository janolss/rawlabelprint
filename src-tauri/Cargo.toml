[package]
name = "rawlabelprint"
version = "0.5.5"
description = "Raw label printing tray app for macOS, Linux and Windows (Zebra LAN/USB printers)"
authors = ["Jan Olsson"]
license = "MIT"
edition = "2021"

[lib]
name = "rawlabelprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = "0.8"
if-addrs = "0.15"
serialport = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json", "gzip"] }
# `zip` feature only needed for compressed updater artifacts (.exe.zip / zipped AppImage);
# we ship a bare NSIS .exe and a bare AppImage, so it stays off.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-notification = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
