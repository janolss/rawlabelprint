name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Pin for WebKitGTK 4.1 and to avoid ubuntu-latest → 26 migration surprises.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Lint
        run: npm run lint

      - run: npm test

  linux-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Linux .deb
        run: npm run tauri build -- --bundles deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: RawLabelPrint-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
