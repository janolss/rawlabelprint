name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Linux .deb
        run: npm run tauri build -- --bundles deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: RawLabelPrint-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows-nsis:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Updater artifacts (.exe.sig) are only produced here; CI builds stay unsigned.
      - name: Build signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.updater.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: RawLabelPrint-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux-deb, windows-nsis]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux .deb
        uses: actions/download-artifact@v7
        with:
          name: RawLabelPrint-linux-deb
          path: dist/

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: RawLabelPrint-windows-nsis
          path: dist/

      # Manifest for tauri-plugin-updater, served via releases/latest/download/latest.json.
      - name: Create updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sigs=(dist/*-setup.exe.sig)
          if [ "${#sigs[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS signature, found ${#sigs[@]}" >&2
            exit 1
          fi
          sig_file="${sigs[0]}"
          exe_name="$(basename "${sig_file%.sig}")"
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$sig_file")" \
            --arg url "https://github.com/${REPO}/releases/download/${TAG}/${exe_name}" \
            '{version: $version, pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json
          rm "$sig_file"
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
